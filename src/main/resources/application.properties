# PostgreSQL JDBC Connection Properties
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?ssl=true&sslmode=verify-ca&sslrootcert=certs/rootCA.crt&sslcert=certs/client.crt&sslkey=certs/client.pk8
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL SSL Connection Properties
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=verify-ca
spring.datasource.hikari.data-source-properties.sslcert=certs/client.crt
spring.datasource.hikari.data-source-properties.sslkey=certs/client.pk8
spring.datasource.hikari.data-source-properties.sslrootcert=certs/rootCA.crt

